<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#21406f">
<title>Cầu Lông LITEON</title>
<style>
/* ===== Màu: chủ đề sân cầu — xanh dương, xanh navy, xanh chanh; bộ sáng và tối ===== */
:root {
  --bg: #eaf2fc; --surface: #ffffff; --surface-2: #f4f8fd; --text: #142a4f; --muted: #56688a; --line: #d6e2f2;
  --blue: #2f8ae8; --blue-2: #4fa6f6; --navy: #21406f; --navy-2: #2b5288; --lime: #b4df1e; --on-lime: #142a4f;
  --accent: #1f6fd1; --accent-soft: #e2effd;
  /* Nền băng tiêu đề: đủ đậm để chữ trắng đạt tương phản (đo bằng npm run test:contrast) */
  --hero-1: #2a6fcc; --hero-2: #1f5fb5;
  --bad: #c9362b; --bad-soft: #fde9e7; --warn: #9a5c00; --warn-soft: #fff1d6; --gray-soft: #e9eef5;
  --on-dark: #ffffff; --on-dark-muted: #c4d6f2;
  --shadow: 0 1px 2px rgba(20,42,79,.05), 0 8px 24px rgba(20,42,79,.09);
  --shadow-lg: 0 24px 60px rgba(20,42,79,.2);
  /* Font hẹp có đủ dấu tiếng Việt. KHÔNG dùng "Arial Narrow": thiếu 92 chữ có dấu (Ả, Ầ, Ổ, Ơ, Ư…) → lẫn font (kiểm tra 2026-10-25) */
  --display: "Bahnschrift SemiCondensed", "Bahnschrift", "Avenir Next Condensed", "Roboto Condensed", sans-serif-condensed, system-ui, sans-serif;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1527; --surface: #13223c; --surface-2: #182a48; --text: #eaf1fb; --muted: #9fb2d1; --line: #263b5e;
    --blue: #3b8fe6; --blue-2: #5aa9ff; --navy: #0d1c35; --navy-2: #17305a; --lime: #c3ec2c; --on-lime: #0b1527;
    --accent: #6cb4ff; --accent-soft: #1a3358;
    --hero-1: #1f5fb5; --hero-2: #184c94;
    --bad: #ff8a7d; --bad-soft: #3a1d1a; --warn: #f2b45a; --warn-soft: #33270f; --gray-soft: #1d2c46;
    --on-dark-muted: #a9bfe3;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --shadow-lg: 0 24px 60px rgba(0,0,0,.55);
  }
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }  /* lưới an toàn — KHÔNG dùng để giấu phần tràn */
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
.hidden { display: none !important; }
svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* Dữ liệu dài luôn xuống dòng, không cắt, không tràn ngang */
.card, .sheet, .hist-item, .voter, .msg, .info-row, .s-title, .s-date { overflow-wrap: anywhere; }
/* Chữ tiêu đề kiểu thể thao: in hoa, nghiêng, đậm */
.display { font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; line-height: 1.35; }
.s-title.display, .detail-title.display { text-transform: none; }  /* chứa dữ liệu từ Sheets → giữ nguyên hoa/thường */
/* Chữ Hán: font Hán hệ thống, đứng thẳng (nghiêng giả làm chữ Hán méo, khó đọc). Phần tử lang="vi" (tên web, dữ liệu) không bị ảnh hưởng. */
.display:lang(zh), .btn-primary:lang(zh) { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", system-ui, sans-serif; font-style: normal; letter-spacing: .04em; }
:lang(zh) { line-break: strict; }

/* ===== Khung trang (mobile-first) ===== */
main { width: 100%; max-width: 760px; margin: 0 auto; padding: 16px 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom)); }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px; background: var(--navy); color: var(--on-dark); border-bottom: 4px solid var(--lime); }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 19px; }
.logo-mark { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; color: var(--on-lime);
  background: var(--lime); transform: skewX(-8deg); }
.logo-mark svg { width: 24px; height: 24px; transform: skewX(8deg) rotate(-30deg); stroke-width: 1.8; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.lang-switch { display: flex; padding: 3px; gap: 2px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); }
.lang-btn { min-width: 40px; min-height: 38px; padding: 0 8px; border: 0; border-radius: 9px; background: none; color: var(--on-dark);
  font-weight: 800; font-size: 15px; line-height: 1.35; cursor: pointer; }
.lang-btn[aria-pressed="true"] { background: var(--lime); color: var(--on-lime); }
.lang-btn:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
.icon-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.08); color: var(--on-dark); cursor: pointer; }

/* Thanh tab: điện thoại nằm dưới đáy; máy tính nằm trong thanh trên */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  background: var(--navy); border-top: 4px solid var(--lime); padding: 4px 8px env(safe-area-inset-bottom); }
.tab { min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 0; background: none; color: var(--on-dark-muted); font-size: 13px; font-weight: 700; line-height: 1.35; cursor: pointer; border-radius: 12px; }
.tab[aria-current="page"] { color: var(--lime); }
.tab[aria-current="page"] svg { stroke-width: 2.6; }
@media (min-width: 900px) {
  .tabbar { position: static; display: flex; gap: 6px; border: 0; padding: 0; background: none; margin-left: auto; }
  .tab { flex-direction: row; gap: 8px; min-height: 44px; padding: 0 16px; font-size: 15px; }
  .tab[aria-current="page"] { background: var(--lime); color: var(--on-lime); }
  main { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
}

.view { display: none; }
.view.active { display: block; }

/* ===== Băng tiêu đề: nền xanh có vệt sọc chéo + vạch lưới xanh chanh ===== */
.hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 18px 22px; border-radius: 20px; color: var(--on-dark);
  background:
    linear-gradient(-6deg, transparent 0 6%, var(--lime) 6% 9%, transparent 9%),
    repeating-linear-gradient(-28deg, rgba(255,255,255,.06) 0 6px, transparent 6px 22px),
    linear-gradient(135deg, var(--hero-1), var(--hero-2) 55%, var(--navy-2));
  box-shadow: var(--shadow); }
.hero-text { min-width: 0; }
.hero h1 { margin: 0; font-size: clamp(26px, 8vw, 40px); }
.hero h1 .tag { display: inline-block; padding: 0 10px; margin-bottom: 6px; background: var(--navy); color: var(--lime); font-size: .55em; }
.hero h1 .big { display: block; }
.hero p { margin: 4px 0 0; color: #ffffff; font-weight: 600; }
.hero-shuttle { width: 72px; height: 72px; color: #ffffff; stroke-width: 1.6; transform: rotate(-35deg); }
@media (max-width: 359px) { .hero-shuttle { display: none; } }

.stack { display: grid; gap: 16px; margin-top: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; }

/* ===== Thẻ buổi chơi ===== */
.session { padding: 0 0 16px; }
.session > :not(.s-head) { margin-left: 16px; margin-right: 16px; }
.s-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 16px;
  border-radius: 19px 19px 0 0; color: var(--on-dark); border-bottom: 4px solid var(--lime);
  background: repeating-linear-gradient(-28deg, rgba(255,255,255,.06) 0 6px, transparent 6px 20px), var(--navy); }
.s-title { margin: 0; font-size: 26px; }
.s-date { color: var(--on-dark-muted); font-weight: 700; }
.pill { display: inline-flex; align-items: center; min-height: 30px; padding: 2px 12px; border-radius: 8px; font-size: 13px; font-weight: 800;
  line-height: 1.35; text-transform: uppercase; transform: skewX(-8deg); }
.pill-mo { background: var(--lime); color: var(--on-lime); }
.pill-du { background: #ffb443; color: #3b2300; }
.pill-dong, .pill-chot { background: rgba(255,255,255,.16); color: var(--on-dark); }
.pill-sapmo { background: var(--blue-2); color: #ffffff; }
.s-info { display: grid; gap: 6px; margin-top: 14px; }
.info-row { display: flex; align-items: flex-start; gap: 10px; }
.info-row svg { color: var(--blue); margin-top: 2px; }
.info-row b { font-weight: 700; }
.s-count { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.count-line { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.count-num { font-family: var(--display); font-style: italic; font-size: 40px; font-weight: 900; line-height: 1.35; color: var(--blue); }
.count-max { color: var(--muted); font-weight: 700; }
.bar { height: 10px; border-radius: 5px; background: var(--line); margin-top: 8px; }
.bar > span { display: block; height: 100%; border-radius: 5px; background: var(--lime); }
.bar.full > span { background: #ffb443; }

.s-form { display: grid; gap: 10px; margin-top: 16px; }
.input, .select { width: 100%; min-height: 48px; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); }
.input:focus, .select:focus { outline: 3px solid var(--accent-soft); border-color: var(--blue); }
.msg { margin: 12px 0 0; font-weight: 700; line-height: 1.5; }
.msg:empty { display: none; }
.msg.ok { color: var(--accent); }
.msg.err { color: var(--bad); }

.s-list h3 { margin: 20px 0 8px; font-size: 17px; }
.voters { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.voter { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.voter .num { flex: none; min-width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--navy);
  color: var(--lime); font-size: 13px; font-weight: 800; }
.voter .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.voter .who small { color: var(--muted); font-size: 13px; }
.btn-cancel { flex: none; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  color: var(--bad); font-weight: 700; cursor: pointer; }

/* ===== Lịch sử ===== */
.hist-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 18px;
  border: 1px solid var(--line); border-left: 6px solid var(--lime); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; }
.hist-item .h-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hist-item .h-main b { font-size: 17px; line-height: 1.35; }
.hist-item .h-main span { color: var(--muted); font-size: 14px; }
.hist-item .h-count { flex: none; font-weight: 800; color: var(--accent); }

/* ===== Đăng ký ===== */
.form { display: grid; gap: 14px; margin-top: 16px; }
.field { display: grid; gap: 6px; }
.field > span { font-weight: 700; }
.field em { color: var(--bad); font-style: normal; }
.field small { color: var(--muted); font-weight: 400; }

/* ===== Nút ===== */
.btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border-radius: 12px; border: 0;
  background: var(--lime); color: var(--on-lime); font-family: var(--display); font-style: italic; font-weight: 900; font-size: 19px;
  text-transform: uppercase; letter-spacing: .02em; line-height: 1.35; cursor: pointer; box-shadow: 0 4px 0 rgba(20,42,79,.25); }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(20,42,79,.25); }
.btn-primary:disabled { opacity: .6; cursor: default; }
.btn-primary:focus-visible, .btn-ghost:focus-visible, .tab:focus-visible, .hist-item:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.btn-danger { background: #c9362b; color: #fff; }  /* cố định cả sáng/tối: chữ trắng đạt tương phản */
.btn-ghost { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; }

/* ===== Hộp thoại: điện thoại trượt từ dưới, máy tính ở giữa ===== */
.sheet-bg { position: fixed; inset: 0; background: rgba(8,18,36,.55); display: none; z-index: 20; }
.sheet-bg.open { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: var(--surface); margin: 0 auto; max-width: 640px;
  border-radius: 24px 24px 0 0; border-top: 5px solid var(--lime); padding: 12px 20px calc(24px + env(safe-area-inset-bottom)); box-shadow: var(--shadow-lg); }
@media (min-width: 900px) {
  .sheet { left: 50%; top: 50%; bottom: auto; right: auto; transform: translate(-50%, -50%); width: min(560px, 92vw); max-height: 88vh; border-radius: 24px; padding: 24px; }
  .grab { display: none; }
}
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.detail-title { margin: 0 0 8px; font-size: 24px; }
.sheet-sub { margin: 0 0 12px; color: var(--muted); }
.sheet-actions { display: grid; gap: 10px; margin-top: 20px; }

/* ===== Tải / lỗi ===== */
.loading-screen { position: fixed; inset: 0; z-index: 50; background: var(--navy); color: var(--on-dark-muted); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px; padding: 16px; text-align: center; }
.loading-screen .logo { color: var(--on-dark); }
.loading-screen.hidden { display: none; }
.loading-screen.error #load-msg { color: #ffb4aa; font-weight: 700; max-width: 460px; }
.loading-screen .btn-primary { max-width: 220px; }
.spinner { width: 38px; height: 38px; border: 4px solid rgba(255,255,255,.18); border-top-color: var(--lime); border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
.foot { text-align: center; color: var(--muted); font-size: 12px; padding: 28px 0 0; }

</style>
</head>
<body>
<!-- Hình quả cầu dùng chung -->
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <symbol id="i-shuttle" viewBox="0 0 24 24">
    <circle cx="12" cy="19" r="3"/><path d="M9.2 17.2 5 4M14.8 17.2 19 4M5 4q7-3 14 0M12 16V2.6M10.6 16.4 8.5 3.3M13.4 16.4l2.1-13.1M6.8 10h10.4"/>
  </symbol>
</svg>
<!-- data-i18n: chữ giao diện được dịch; data-i18n-aria / data-i18n-ph: nhãn đọc màn hình / chữ gợi ý. Tên web (lang="vi") giữ nguyên. -->

<div class="loading-screen" id="loading-screen">
  <div class="logo"><span class="logo-mark"><svg aria-hidden="true"><use href="#i-shuttle"/></svg></span><span class="site-name display" lang="vi"></span></div>
  <div class="spinner" id="load-spinner"></div>
  <div id="load-msg">Đang tải dữ liệu…</div>
  <button class="btn-primary hidden" id="load-retry" type="button" data-i18n="retry">Thử lại</button>
</div>

<header class="topbar">
  <div class="logo"><span class="logo-mark"><svg aria-hidden="true"><use href="#i-shuttle"/></svg></span><span class="site-name display" lang="vi"></span></div>
  <nav class="tabbar" data-i18n-aria="nav" aria-label="Chức năng">
    <button type="button" class="tab" data-view="vote">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
      <span data-i18n="tab.vote">Vote</span>
    </button>
    <button type="button" class="tab" data-view="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      <span data-i18n="tab.history">Lịch sử</span>
    </button>
    <button type="button" class="tab" data-view="register">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M19 8v6M16 11h6"/></svg>
      <span data-i18n="tab.register">Đăng ký</span>
    </button>
  </nav>
  <div class="top-actions">
    <div class="lang-switch" role="group" data-i18n-aria="lang.switch" aria-label="Chọn ngôn ngữ">
      <button type="button" class="lang-btn" data-lang="vi" lang="vi" aria-label="Tiếng Việt">VI</button>
      <button type="button" class="lang-btn" data-lang="zh" lang="zh-Hans" aria-label="简体中文">中</button>
    </div>
    <button type="button" class="icon-btn" id="reload" data-i18n-aria="reload" aria-label="Tải lại">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="view" id="v-vote">
    <div class="hero">
      <div class="hero-text">
        <h1 class="display"><span class="tag" data-i18n="hero.tag">Cầu lông</span><span class="big" data-i18n="vote.title">Vote buổi chơi</span></h1>
        <p id="vote-sub"></p>
      </div>
      <svg class="hero-shuttle" aria-hidden="true"><use href="#i-shuttle"/></svg>
    </div>
    <div class="stack" id="sessions"></div>
  </section>

  <section class="view" id="v-history">
    <div class="hero">
      <div class="hero-text">
        <h1 class="display"><span class="tag" data-i18n="hero.tag">Cầu lông</span><span class="big" data-i18n="hist.title">Lịch sử</span></h1>
        <p data-i18n="hist.sub">Danh sách người đã tham gia các buổi trước.</p>
      </div>
      <svg class="hero-shuttle" aria-hidden="true"><use href="#i-shuttle"/></svg>
    </div>
    <div class="stack" id="hist"></div>
  </section>

  <section class="view" id="v-register">
    <div class="hero">
      <div class="hero-text">
        <h1 class="display"><span class="tag" data-i18n="hero.tag">Cầu lông</span><span class="big" data-i18n="reg.title">Đăng ký thành viên</span></h1>
        <p data-i18n="reg.sub">Sau khi quản trị duyệt, tên của bạn sẽ có trong danh sách vote.</p>
      </div>
      <svg class="hero-shuttle" aria-hidden="true"><use href="#i-shuttle"/></svg>
    </div>
    <form class="card form" id="reg-form" novalidate>
      <label class="field"><span><span data-i18n="reg.name">Họ tên</span> <em>*</em></span>
        <input class="input" id="reg-ten" name="ten" autocomplete="name" maxlength="60" required></label>
      <label class="field"><span><span data-i18n="reg.dept">OPU / Bộ phận</span> <em>*</em></span>
        <input class="input" id="reg-bophan" name="boPhan" maxlength="60" required></label>
      <label class="field"><span><span data-i18n="reg.phone">Số điện thoại</span> <small data-i18n="reg.optional">(không bắt buộc)</small></span>
        <input class="input" id="reg-sdt" name="sdt" type="tel" inputmode="tel" autocomplete="tel" maxlength="20"></label>
      <button class="btn-primary" type="submit" id="reg-btn" data-i18n="reg.submit">Gửi đăng ký</button>
      <p class="msg" id="reg-msg" role="status" aria-live="polite"></p>
    </form>
  </section>
  <div class="foot"><span id="build-info"></span></div>
</main>

<div class="sheet-bg" id="sheet-bg">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grab"></div>
    <h2 class="detail-title display" id="sheet-title"></h2>
    <div id="sheet-body"></div>
    <div class="sheet-actions" id="sheet-actions"></div>
  </div>

// ===== Gọi Apps Script bằng JSONP qua thẻ <script> (fetch() vướng CORS, nhất là khi mở file trực tiếp) =====
let seq = 0;
function jsonp(params) {
  return new Promise((resolve, reject) => {
    if (!CFG.app || !CFG.app.apiUrl) return reject(new Error(t("err.noApi")));
    const cb = "__api" + (++seq) + "_" + Date.now();
    const s = document.createElement("script");
    const done = () => { clearTimeout(timer); delete window[cb]; s.remove(); };
    const timer = setTimeout(() => { done(); reject(new Error(t("err.timeout"))); }, 30000);
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error(t("err.network"))); };
    const q = new URLSearchParams({ ...params, callback: cb, _: Date.now() });
    s.src = CFG.app.apiUrl + "?" + q.toString();
    document.head.append(s);
  });
}
async function api(action, params = {}) {

  if (!res || !res.ok) throw new Error(res && res.loi ? tServer(res.loi) : t("err.generic"));
  return res;
}

  catch (e) {
    box.replaceChildren(el("div", "card empty", e.message));
    const b = el("button", "btn-ghost", t("retry")); b.type = "button"; b.onclick = loadHistory; box.append(b);
  }
}
function renderHistory() {
  const box = $("hist");
  box.replaceChildren();
  if (!HISTORY.length) { box.append(el("div", "card empty", t("histEmpty"))); return; }
  HISTORY.forEach(s => {
    const b = el("button", "hist-item"); b.type = "button";
    const main = el("div", "h-main"), sub = el("span");
    sub.append(vi(el("span", null, s.gio)), document.createTextNode(" · "), vi(el("span", null, s.san)));
    main.append(el("b", null, `${fmtThu(s)} · ${fmtNgay(s.ngay)}`), sub);
    b.append(main, el("span", "h-count", t("people", { n: s.votes.length })));
    b.onclick = () => openHistory(s);
    box.append(b);
  });
}
function openHistory(s) {
  const body = el("div");
  const sub = el("p", "sheet-sub");
  sub.append(vi(el("span", null, s.gio)), document.createTextNode(" · "), vi(el("span", null, s.san)),
    document.createTextNode(" · " + t("people", { n: s.votes.length })));
  body.append(sub);
  if (!s.votes.length) body.append(el("p", "empty", t("nobody")));
  else {
    const ol = el("ol", "voters");
    s.votes.forEach((v, i) => ol.append(voterRow(v, i)));
    body.append(ol);
  }
  openSheet(`${fmtThu(s)} · ${fmtNgay(s.ngay)}`, "", body, [[t("close"), "btn-ghost", closeSheet]]);
}

// ===== Tab Đăng ký =====
async function submitRegister(e) {
  e.preventDefault();
  const msg = $("reg-msg"), btn = $("reg-btn");
  const ten = $("reg-ten").value.trim(), boPhan = $("reg-bophan").value.trim(), sdt = $("reg-sdt").value.trim();
  const fail = tx => { msg.className = "msg err"; msg.textContent = tx; };
  if (!ten) return fail(t("reg.needName"));
  if (!boPhan) return fail(t("reg.needDept"));
  btn.disabled = true; btn.textContent = t("sending"); msg.textContent = "";
  try {
    const res = await api("register", { ten, boPhan, sdt });
    $("reg-form").reset();
    msg.className = "msg ok"; msg.textContent = tServer(res.thongBao);
  } catch (err) { fail(err.message); }
  btn.disabled = false; btn.textContent = t("reg.submit");
}

// ===== Hộp thoại =====
function openSheet(title, sub, body, actions) {
  $("sheet-title").textContent = title;
  const b = $("sheet-body"); b.replaceChildren();
  if (sub) b.append(el("p", "sheet-sub", sub));
  if (body) b.append(body);
  const a = $("sheet-actions"); a.replaceChildren();
  actions.forEach(([text, cls, fn]) => { const btn = el("button", cls, text); btn.type = "button"; btn.onclick = () => fn(btn); a.append(btn); });
  $("sheet-bg").classList.add("open");
}
function closeSheet() { $("sheet-bg").classList.remove("open"); }

// ===== Chuyển tab =====
let current = "vote";
function show(v) {
  current = v;
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("active", s.id === "v-" + v));
  document.querySelectorAll(".tab").forEach(tb => { if (tb.dataset.view === v) tb.setAttribute("aria-current", "page"); else tb.removeAttribute("aria-current"); });
  if (v === "history") loadHistory();
  window.scrollTo(0, 0);
}

// ===== Ngôn ngữ (lưu lựa chọn trên máy người xem; không lưu được thì vẫn chạy bình thường) =====
function setLang(l) {
  LANG = l === "zh" ? "zh" : "vi";
  try { localStorage.setItem("lang", LANG); } catch (e) {}
  document.documentElement.lang = LANG === "zh" ? "zh-Hans" : "vi";
  document.querySelectorAll("[data-i18n]").forEach(n => n.textContent = t(n.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(n => n.setAttribute("aria-label", t(n.dataset.i18nAria)));
  document.querySelectorAll(".lang-btn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  $("build-info").textContent = CFG.builtAt ? t("build", { t: fmtNow(new Date(CFG.builtAt)) }) : "";
  if (!$("loading-screen").classList.contains("error")) $("load-msg").textContent = t("load");
  $("reg-msg").textContent = "";
  renderVote();
  if (HISTORY) renderHistory();
  closeSheet();
}
function savedLang() {
  try { const s = localStorage.getItem("lang"); if (s) return s; } catch (e) {}
  return /^zh/i.test(navigator.language || "") ? "zh" : "vi";
}

// ===== Khởi động =====
const siteName = (CFG.site && CFG.site.name) || "Cầu Lông";
document.title = siteName;
document.querySelectorAll(".site-name").forEach(n => n.textContent = siteName);
document.querySelectorAll(".tab").forEach(tb => tb.onclick = () => show(tb.dataset.view));
document.querySelectorAll(".lang-btn").forEach(b => b.onclick = () => setLang(b.dataset.lang));
$("reload").onclick = loadState;
$("load-retry").onclick = loadState;
$("reg-form").onsubmit = submitRegister;
$("sheet-bg").onclick = e => { if (e.target.id === "sheet-bg") closeSheet(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
setLang(savedLang());
show("vote");
loadState();

</script>
</body>
