<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#21406f">
<title>Cầu Lông LITEON</title>
<style>
/* ===== Màu: chủ đề sân cầu — xanh dương, xanh navy, xanh chanh; bộ sáng và tối ===== */
:root {
  --bg: #eaf2fc; --surface: #ffffff; --surface-2: #f4f8fd; --text: #142a4f; --muted: #56688a; --line: #d6e2f2;
  --blue: #2f8ae8; --blue-2: #4fa6f6; --navy: #21406f; --navy-2: #2b5288; --lime: #b4df1e; --on-lime: #142a4f;
  --accent: #1f6fd1; --accent-soft: #e2effd;
  /* Nền băng tiêu đề: đủ đậm để chữ trắng đạt tương phản (đo bằng npm run test:contrast) */
  --hero-1: #2a6fcc; --hero-2: #1f5fb5;
  --bad: #c9362b; --bad-soft: #fde9e7; --warn: #9a5c00; --warn-soft: #fff1d6; --gray-soft: #e9eef5;
  --on-dark: #ffffff; --on-dark-muted: #c4d6f2;
  --shadow: 0 1px 2px rgba(20,42,79,.05), 0 8px 24px rgba(20,42,79,.09);
  --shadow-lg: 0 24px 60px rgba(20,42,79,.2);
  /* Font hẹp có đủ dấu tiếng Việt. KHÔNG dùng "Arial Narrow": thiếu 92 chữ có dấu (Ả, Ầ, Ổ, Ơ, Ư…) → lẫn font (kiểm tra 2026-10-25) */
  --display: "Bahnschrift SemiCondensed", "Bahnschrift", "Avenir Next Condensed", "Roboto Condensed", sans-serif-condensed, system-ui, sans-serif;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1527; --surface: #13223c; --surface-2: #182a48; --text: #eaf1fb; --muted: #9fb2d1; --line: #263b5e;
    --blue: #3b8fe6; --blue-2: #5aa9ff; --navy: #0d1c35; --navy-2: #17305a; --lime: #c3ec2c; --on-lime: #0b1527;
    --accent: #6cb4ff; --accent-soft: #1a3358;
    --hero-1: #1f5fb5; --hero-2: #184c94;
    --bad: #ff8a7d; --bad-soft: #3a1d1a; --warn: #f2b45a; --warn-soft: #33270f; --gray-soft: #1d2c46;
    --on-dark-muted: #a9bfe3;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --shadow-lg: 0 24px 60px rgba(0,0,0,.55);
  }
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }  /* lưới an toàn — KHÔNG dùng để giấu phần tràn */
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
.hidden { display: none !important; }
svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* Dữ liệu dài luôn xuống dòng, không cắt, không tràn ngang */
.card, .sheet, .hist-item, .voter, .msg, .info-row, .s-title, .s-date { overflow-wrap: anywhere; }
/* Chữ tiêu đề kiểu thể thao: in hoa, nghiêng, đậm */
.display { font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; line-height: 1.35; }
.s-title.display, .detail-title.display { text-transform: none; }  /* chứa dữ liệu từ Sheets → giữ nguyên hoa/thường */
/* Chữ Hán: font Hán hệ thống, đứng thẳng (nghiêng giả làm chữ Hán méo, khó đọc). Phần tử lang="vi" (tên web, dữ liệu) không bị ảnh hưởng. */
.display:lang(zh), .btn-primary:lang(zh) { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", system-ui, sans-serif; font-style: normal; letter-spacing: .04em; }
:lang(zh) { line-break: strict; }

/* ===== Khung trang (mobile-first) ===== */
main { width: 100%; max-width: 760px; margin: 0 auto; padding: 16px 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom)); }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px; background: var(--navy); color: var(--on-dark); border-bottom: 4px solid var(--lime); }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 19px; }
.logo-mark { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; color: var(--on-lime);
  background: var(--lime); transform: skewX(-8deg); }
.logo-mark svg { width: 24px; height: 24px; transform: skewX(8deg) rotate(-30deg); stroke-width: 1.8; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.lang-switch { display: flex; padding: 3px; gap: 2px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); }
.lang-btn { min-width: 40px; min-height: 38px; padding: 0 8px; border: 0; border-radius: 9px; background: none; color: var(--on-dark);
  font-weight: 800; font-size: 15px; line-height: 1.35; cursor: pointer; }
.lang-btn[aria-pressed="true"] { background: var(--lime); color: var(--on-lime); }
.lang-btn:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
.icon-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.08); color: var(--on-dark); cursor: pointer; }

/* Thanh tab: điện thoại nằm dưới đáy; máy tính nằm trong thanh trên */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  background: var(--navy); border-top: 4px solid var(--lime); padding: 4px 8px env(safe-area-inset-bottom); }
.tab { min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 0; background: none; color: var(--on-dark-muted); font-size: 13px; font-weight: 700; line-height: 1.35; cursor: pointer; border-radius: 12px; }
.tab[aria-current="page"] { color: var(--lime); }
.tab[aria-current="page"] svg { stroke-width: 2.6; }
@media (min-width: 900px) {
  .tabbar { position: static; display: flex; gap: 6px; border: 0; padding: 0; background: none; margin-left: auto; }
  .tab { flex-direction: row; gap: 8px; min-height: 44px; padding: 0 16px; font-size: 15px; }
  .tab[aria-current="page"] { background: var(--lime); color: var(--on-lime); }
  main { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
}

.view { display: none; }
.view.active { display: block; }

/* ===== Băng tiêu đề: nền xanh có vệt sọc chéo + vạch lưới xanh chanh ===== */
.hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 18px 22px; border-radius: 20px; color: var(--on-dark);
  background:
    linear-gradient(-6deg, transparent 0 6%, var(--lime) 6% 9%, transparent 9%),
    repeating-linear-gradient(-28deg, rgba(255,255,255,.06) 0 6px, transparent 6px 22px),
    linear-gradient(135deg, var(--hero-1), var(--hero-2) 55%, var(--navy-2));
  box-shadow: var(--shadow); }
.hero-text { min-width: 0; }
.hero h1 { margin: 0; font-size: clamp(26px, 8vw, 40px); }
.hero h1 .tag { display: inline-block; padding: 0 10px; margin-bottom: 6px; background: var(--navy); color: var(--lime); font-size: .55em; }
.hero h1 .big { display: block; }
.hero p { margin: 4px 0 0; color: #ffffff; font-weight: 600; }
.hero-shuttle { width: 72px; height: 72px; color: #ffffff; stroke-width: 1.6; transform: rotate(-35deg); }
@media (max-width: 359px) { .hero-shuttle { display: none; } }

.stack { display: grid; gap: 16px; margin-top: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; }

/* ===== Thẻ buổi chơi ===== */
.session { padding: 0 0 16px; }
.session > :not(.s-head) { margin-left: 16px; margin-right: 16px; }
.s-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 16px;
  border-radius: 19px 19px 0 0; color: var(--on-dark); border-bottom: 4px solid var(--lime);
  background: repeating-linear-gradient(-28deg, rgba(255,255,255,.06) 0 6px, transparent 6px 20px), var(--navy); }
.s-title { margin: 0; font-size: 26px; }
.s-date { color: var(--on-dark-muted); font-weight: 700; }
.pill { display: inline-flex; align-items: center; min-height: 30px; padding: 2px 12px; border-radius: 8px; font-size: 13px; font-weight: 800;
  line-height: 1.35; text-transform: uppercase; transform: skewX(-8deg); }
.pill-mo { background: var(--lime); color: var(--on-lime); }
.pill-du { background: #ffb443; color: #3b2300; }
.pill-dong, .pill-chot { background: rgba(255,255,255,.16); color: var(--on-dark); }
.pill-sapmo { background: #1f6fd1; color: #ffffff; }
.pill-giaoluu { background: #ffffff; color: var(--navy); }
.count-break { margin-top: 6px; color: var(--muted); font-size: 14px; font-weight: 600; }
.gl-wrap { margin-top: 16px; }
.gl-wrap .s-form { margin-top: 0; }
.gl-hint { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
.gl-hint:empty { display: none; }
.gl-plus { flex: none; padding: 4px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--text); font-size: 13px; font-weight: 700; line-height: 1.35; }
.s-info { display: grid; gap: 6px; margin-top: 14px; }
.info-row { display: flex; align-items: flex-start; gap: 10px; }
.info-row svg { color: var(--blue); margin-top: 2px; }
.info-row b { font-weight: 700; }
.s-count { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.count-line { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.count-num { font-family: var(--display); font-style: italic; font-size: 40px; font-weight: 900; line-height: 1.35; color: var(--blue); }
.count-max { color: var(--muted); font-weight: 700; }
.bar { height: 10px; border-radius: 5px; background: var(--line); margin-top: 8px; }
.bar > span { display: block; height: 100%; border-radius: 5px; background: var(--lime); }
.bar.full > span { background: #ffb443; }

.s-form { display: grid; gap: 10px; margin-top: 16px; }
.input, .select { width: 100%; min-height: 48px; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); }
.input:focus, .select:focus { outline: 3px solid var(--accent-soft); border-color: var(--blue); }
.msg { margin: 12px 0 0; font-weight: 700; line-height: 1.5; }
.msg:empty { display: none; }
.msg.ok { color: var(--accent); }
.msg.err { color: var(--bad); }

.s-list h3 { margin: 20px 0 8px; font-size: 17px; }
.voters { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.voter { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.voter .num { flex: none; min-width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--navy);
  color: var(--lime); font-size: 13px; font-weight: 800; }
.voter .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.voter .who small { color: var(--muted); font-size: 13px; }
.btn-cancel { flex: none; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  color: var(--bad); font-weight: 700; cursor: pointer; }

/* ===== Lịch sử ===== */
.hist-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 18px;
  border: 1px solid var(--line); border-left: 6px solid var(--lime); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; }
.hist-item .h-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hist-item .h-main b { font-size: 17px; line-height: 1.35; }
.hist-item .h-main span { color: var(--muted); font-size: 14px; }
.hist-item .h-count { flex: none; font-weight: 800; color: var(--accent); }

/* ===== Điểm danh ===== */
.dd-badge { align-self: flex-start; margin-top: 4px; padding: 2px 8px; border-radius: 6px; background: var(--lime); color: var(--on-lime);
  font-size: 12px; font-weight: 800; line-height: 1.35; }
.hist-item .h-main .dd-badge { color: var(--on-lime); font-size: 12px; }  /* thắng quy tắc chữ xám của .h-main span */
.dd-head { margin: 16px 0 8px; font-size: 17px; line-height: 1.35; }
.dd-total { margin: 0 0 8px; font-size: 20px; font-weight: 800; line-height: 1.35; color: var(--accent); }
.dd .msg { margin: 0 0 8px; }
.dd-fromreg { margin: 8px 0 4px; }
.dd-list { margin-top: 12px; }
.dd-list .voter { flex-wrap: wrap; }
.dd-list .who { min-width: 9em; }
.dd-plus { align-self: flex-start; margin-top: 4px; }
.dd-acts { display: flex; gap: 6px; margin-left: auto; }
.btn-mini { min-height: 44px; min-width: 52px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  color: var(--text); font-weight: 700; cursor: pointer; }
.btn-mini-bad { color: var(--bad); }
.dd-edit { flex: 1 1 100%; display: grid; gap: 8px; }
.dd-add { margin-top: 8px; }
.dd-add .dd-head { margin: 8px 0 0; }

/* ===== Đăng ký ===== */
.form { display: grid; gap: 14px; margin-top: 16px; }
.field { display: grid; gap: 6px; }
.field > span { font-weight: 700; }
.field em { color: var(--bad); font-style: normal; }
.field small { color: var(--muted); font-weight: 400; }

/* ===== Nút ===== */
.btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border-radius: 12px; border: 0;
  background: var(--lime); color: var(--on-lime); font-family: var(--display); font-style: italic; font-weight: 900; font-size: 19px;
  text-transform: uppercase; letter-spacing: .02em; line-height: 1.35; cursor: pointer; box-shadow: 0 4px 0 rgba(20,42,79,.25); }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(20,42,79,.25); }
.btn-primary:disabled { opacity: .6; cursor: default; }
.btn-primary:focus-visible, .btn-ghost:focus-visible, .tab:focus-visible, .hist-item:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.btn-danger { background: #c9362b; color: #fff; }  /* cố định cả sáng/tối: chữ trắng đạt tương phản */
.btn-ghost { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; }

/* ===== Hộp thoại: điện thoại trượt từ dưới, máy tính ở giữa ===== */
.sheet-bg { position: fixed; inset: 0; background: rgba(8,18,36,.55); display: none; z-index: 20; }
.sheet-bg.open { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: var(--surface); margin: 0 auto; max-width: 640px;
  border-radius: 24px 24px 0 0; border-top: 5px solid var(--lime); padding: 12px 20px calc(24px + env(safe-area-inset-bottom)); box-shadow: var(--shadow-lg); }
@media (min-width: 900px) {
  .sheet { left: 50%; top: 50%; bottom: auto; right: auto; transform: translate(-50%, -50%); width: min(560px, 92vw); max-height: 88vh; border-radius: 24px; padding: 24px; }
  .grab { display: none; }
}
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.detail-title { margin: 0 0 8px; font-size: 24px; }
.sheet-sub { margin: 0 0 12px; color: var(--muted); }
.sheet-actions { display: grid; gap: 10px; margin-top: 20px; }

/* ===== Màn hình chọn ngôn ngữ (lần đầu vào web) ===== */
.lang-gate { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  background: repeating-linear-gradient(-28deg, rgba(255,255,255,.04) 0 6px, transparent 6px 22px), var(--navy); color: var(--on-dark); }
.lang-gate-box { width: 100%; max-width: 360px; display: grid; gap: 16px; justify-items: center; text-align: center; }
.lang-gate-title { margin: 8px 0; display: grid; gap: 2px; font-size: 22px; line-height: 1.35; font-weight: 800; }
.lang-gate .btn-primary { min-height: 56px; font-size: 20px; }
.lang-gate .btn-primary:lang(vi) { font-style: italic; }

/* ===== Tải / lỗi ===== */
.loading-screen { position: fixed; inset: 0; z-index: 50; background: var(--navy); color: var(--on-dark-muted); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px; padding: 16px; text-align: center; }
.loading-screen .logo { color: var(--on-dark); }
.loading-screen.hidden { display: none; }
.loading-screen.error #load-msg { color: #ffb4aa; font-weight: 700; max-width: 460px; }
.loading-screen .btn-primary { max-width: 220px; }
.spinner { width: 38px; height: 38px; border: 4px solid rgba(255,255,255,.18); border-top-color: var(--lime); border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
.foot { text-align: center; color: var(--muted); font-size: 12px; padding: 28px 0 0; }

</style>
</head>
<body>
<!-- Hình quả cầu dùng chung -->
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <symbol id="i-shuttle" viewBox="0 0 24 24">
    <circle cx="12" cy="19" r="3"/><path d="M9.2 17.2 5 4M14.8 17.2 19 4M5 4q7-3 14 0M12 16V2.6M10.6 16.4 8.5 3.3M13.4 16.4l2.1-13.1M6.8 10h10.4"/>
  </symbol>
</svg>
<!-- data-i18n: chữ giao diện được dịch; data-i18n-aria / data-i18n-ph: nhãn đọc màn hình / chữ gợi ý. Tên web (lang="vi") giữ nguyên. -->

<!-- Màn hình chọn ngôn ngữ: hiện ngay khi vào web nếu máy này chưa từng chọn (song ngữ cố định, không dịch) -->
<div class="lang-gate hidden" id="lang-gate" role="dialog" aria-modal="true" aria-labelledby="lang-gate-title">
  <div class="lang-gate-box">
    <div class="logo"><span class="logo-mark"><svg aria-hidden="true"><use href="#i-shuttle"/></svg></span><span class="site-name display" lang="vi"></span></div>
    <h1 class="lang-gate-title" id="lang-gate-title"><span lang="vi">Chọn ngôn ngữ</span><span lang="zh-Hans">选择语言</span></h1>
    <button type="button" class="btn-primary lang-pick" data-lang="vi" lang="vi">Tiếng Việt</button>
    <button type="button" class="btn-primary lang-pick" data-lang="zh" lang="zh-Hans">简体中文</button>
  </div>
</div>

<div class="loading-screen" id="loading-screen">
  <div class="logo"><span class="logo-mark"><svg aria-hidden="true"><use href="#i-shuttle"/></svg></span><span class="site-name display" lang="vi"></span></div>
  <div class="spinner" id="load-spinner"></div>
  <div id="load-msg">Đang tải dữ liệu…</div>
  <button class="btn-primary hidden" id="load-retry" type="button" data-i18n="retry">Thử lại</button>
</div>

<header class="topbar">
  <div class="logo"><span class="logo-mark"><svg aria-hidden="true"><use href="#i-shuttle"/></svg></span><span class="site-name display" lang="vi"></span></div>
  <nav class="tabbar" data-i18n-aria="nav" aria-label="Chức năng">
    <button type="button" class="tab" data-view="vote">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
      <span data-i18n="tab.vote">Vote</span>
    </button>
    <button type="button" class="tab" data-view="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      <span data-i18n="tab.history">Lịch sử</span>
    </button>
    <button type="button" class="tab" data-view="register">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M19 8v6M16 11h6"/></svg>
      <span data-i18n="tab.register">Đăng ký</span>
    </button>
  </nav>
  <div class="top-actions">

// Chữ giao diện lấy qua t() (src/i18n.js). Dữ liệu từ Sheets hiện nguyên văn, gắn lang="vi" (tên người, bộ phận, sân, giờ).
const CFG = window.APP_CONFIG || { site: {}, app: {} };
let STATE = { sessions: [], members: [] };  // trả về nguyên văn từ Apps Script
let HISTORY = null;
let LOADED_AT = null;

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const vi = e => { e.lang = "vi"; return e; };  // dữ liệu tiếng Việt giữ nguyên ở mọi ngôn ngữ
const key = v => String(v ?? "").normalize("NFC").trim().toLowerCase();  // chỉ dùng để SO SÁNH
const ICONS = {
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  pin: '<path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  unlock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>'
};
function icon(name) {  // chỉ dùng chuỗi SVG cố định ở trên, không chứa dữ liệu
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); s.innerHTML = ICONS[name];
  return s;
}

// ===== Gọi Apps Script bằng JSONP qua thẻ <script> (fetch() vướng CORS, nhất là khi mở file trực tiếp) =====
let seq = 0;
function jsonp(params) {
  return new Promise((resolve, reject) => {
    if (!CFG.app || !CFG.app.apiUrl) return reject(new Error(t("err.noApi")));
    const cb = "__api" + (++seq) + "_" + Date.now();
    const s = document.createElement("script");
    const done = () => { clearTimeout(timer); delete window[cb]; s.remove(); };
    const timer = setTimeout(() => { done(); reject(new Error(t("err.timeout"))); }, 30000);
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error(t("err.network"))); };
    const q = new URLSearchParams({ ...params, callback: cb, _: Date.now() });
    s.src = CFG.app.apiUrl + "?" + q.toString();
    document.head.append(s);
  });
}
async function api(action, params = {}) {
  const res = window.MOCK_API ? await window.MOCK_API(action, params) : await jsonp({ action, ...params });
  if (!res || !res.ok) throw new Error(res && res.loi ? tServer(res.loi) : t("err.generic"));
  return res;
}

// ===== Tải trạng thái =====
async function loadState() {
  const scr = $("loading-screen");
  scr.classList.remove("hidden", "error");
  $("load-spinner").classList.remove("hidden");
  $("load-retry").classList.add("hidden");
  $("load-msg").textContent = t("load");
  try {
    STATE = await api("state");
  } catch (e) {
    scr.classList.add("error");
    $("load-spinner").classList.add("hidden");
    $("load-msg").textContent = e.message;
    $("load-retry").classList.remove("hidden");
    return;
  }
  HISTORY = null;
  LOADED_AT = new Date();
  scr.classList.add("hidden");
  renderVote();
  if (current === "history") loadHistory();
}

// ===== Tab Vote =====
function renderVote() {
  const box = $("sessions");
  box.replaceChildren();
  $("vote-sub").textContent = LOADED_AT ? t("updated", { t: fmtNow(LOADED_AT) }) : "";
  if (!STATE.sessions.length) { box.append(el("div", "card empty", t("noSession"))); return; }
  STATE.sessions.forEach(s => box.append(sessionCard(s)));
}

function infoRow(ic, label, value, isData) {
  const r = el("div", "info-row"); const tx = el("span");
  if (label) tx.append(el("b", null, label + " "));
  const v = el("span", null, value);
  tx.append(isData ? vi(v) : v);
  r.append(icon(ic), tx);
  return r;
}

function sessionCard(s) {
  const tt = s.trangThai, card = el("article", "card session");
  card.dataset.ma = s.ma;

  const head = el("div", "s-head"), title = el("div");
  const thu = el("h2", "s-title display", fmtThu(s));
  if (LANG !== "zh") vi(thu);  // tiếng Việt: nguyên văn cột Thu
  title.append(thu, el("div", "s-date", fmtNgay(s.ngay)));
  head.append(title, el("span", "pill pill-" + tt.ma, t("st." + tt.ma)));

  const info = el("div", "s-info");
  info.append(infoRow("clock", "", s.gio, true), infoRow("pin", "", s.san, true));
  if (tt.ma === "sapmo") info.append(infoRow("unlock", t("openAt"), fmtMoc(s.moLuc)));
  info.append(infoRow("lock", t("closeAt"), fmtMoc(s.dongLuc)));
  if (tt.ma === "giaoluu" && s.batDauLuc) info.append(infoRow("clock", t("gl.until"), fmtMoc(s.batDauLuc)));

  const n = s.votes.length, gl = s.giaoLuu || [], soGL = Number(s.soGiaoLuu) || 0;
  const tong = s.tong != null ? Number(s.tong) : n, max = Number(s.max) || 0;  // tổng = vote + chỗ giao lưu
  const count = el("div", "s-count"), line = el("div", "count-line");
  line.append(el("span", "count-num", String(tong)), el("span", "count-max", t("ofMax", { max: s.max })));
  const bar = el("div", "bar" + (max && tong >= max ? " full" : "")), fill = el("span");
  fill.style.width = (max ? Math.min(100, tong / max * 100) : 0) + "%";
  bar.append(fill); count.append(line, bar);
  if (soGL) count.append(el("div", "count-break", t("gl.breakdown", { v: n, g: soGL })));

  card.append(head, info, count);
  if (tt.voteDuoc) card.append(voteForm(s));
  if (tt.giaoLuuDuoc) card.append(guestForm(s, max - tong));
  const msg = el("p", "msg"); msg.setAttribute("role", "status"); msg.setAttribute("aria-live", "polite");
  card.append(msg);

  if (gl.length) card.append(guestList(gl, soGL));
  if (n) {
    const list = el("div", "s-list"), ol = el("ol", "voters");
    list.append(el("h3", null, t("votedList", { n })));
    s.votes.forEach((v, i) => {
      const li = voterRow(v, i);
      if (tt.huyDuoc) {
        const b = el("button", "btn-cancel", t("cancel")); b.type = "button";
        b.setAttribute("aria-label", t("cancelOf", { name: v.ten }));
        b.onclick = () => confirmCancel(s, v);
        li.append(b);
      }
      ol.append(li);
    });
    list.append(ol); card.append(list);
  }
  return card;
}

const tongCua = s => (s.tong != null ? Number(s.tong) : s.votes.length);  // máy chủ cũ chưa có giao lưu → chỉ đếm vote

function voterRow(v, i) {
  const li = el("li", "voter"), who = el("div", "who");
  who.append(vi(el("b", null, v.ten)));
  if (v.boPhan) who.append(vi(el("small", null, v.boPhan)));
  li.append(el("span", "num", String(i + 1)), who);
  return li;
}

function voteForm(s) {
  const f = el("form", "s-form"); f.noValidate = true;
  const voted = new Set(s.votes.map(v => key(v.ten)));
  const avail = STATE.members.filter(m => !voted.has(key(m.ten)));  // giữ đúng thứ tự trong Sheets
  const search = el("input", "input"); search.type = "search"; search.placeholder = t("search"); search.setAttribute("aria-label", t("searchLabel"));
  const sel = el("select", "select"); sel.setAttribute("aria-label", t("pickLabel"));
  const fill = () => {
    const q = key(search.value);
    sel.replaceChildren(new Option(avail.length ? t("pick") : t("noMember"), ""));
    avail.filter(m => !q || key(m.ten + " " + m.boPhan).includes(q))
      .forEach(m => { const o = new Option(m.boPhan ? `${m.ten} — ${m.boPhan}` : m.ten, m.ten); o.lang = "vi"; sel.append(o); });
    if (q && sel.options.length === 2) sel.selectedIndex = 1;
  };
  search.oninput = fill; fill();
  const btn = el("button", "btn-primary", t("vote")); btn.type = "submit";
  f.append(search, sel, btn);
  f.onsubmit = async e => {
    e.preventDefault();
    if (!sel.value) return showMsg(s.ma, t("needPick"), false);
    btn.disabled = true; btn.textContent = t("sending");
    try { const res = await api("vote", { buoi: s.ma, ten: sel.value }); afterAction(res, s.ma); }
    catch (err) { btn.disabled = false; btn.textContent = t("vote"); showMsg(s.ma, err.message, false); }
  };
  return f;
}

// ===== Tuyển giao lưu (hết giờ vote, chưa tới giờ chơi, còn chỗ) =====
function guestForm(s, con) {
  const wrap = el("div", "gl-wrap");
  const open = el("button", "btn-primary btn-guest", t("gl.btn")); open.type = "button";
  open.setAttribute("aria-expanded", "false");
  const f = el("form", "s-form hidden"); f.noValidate = true;
  // Chỉ người ĐÃ VOTE buổi này (theo thứ tự vote), trừ người đã đăng ký giao lưu
  const daDK = new Set((s.giaoLuu || []).map(g => key(g.ten)));
  const avail = s.votes.filter(v => !daDK.has(key(v.ten)));
  const search = el("input", "input"); search.type = "search"; search.placeholder = t("search"); search.setAttribute("aria-label", t("searchLabel"));
  const sel = el("select", "select"); sel.setAttribute("aria-label", t("gl.member"));
  const fill = () => {
    const q = key(search.value);
    sel.replaceChildren(new Option(avail.length ? t("pick") : t("noMember"), ""));
    avail.filter(m => !q || key(m.ten + " " + m.boPhan).includes(q))
      .forEach(m => { const o = new Option(m.boPhan ? `${m.ten} — ${m.boPhan}` : m.ten, m.ten); o.lang = "vi"; sel.append(o); });
    if (q && sel.options.length === 2) sel.selectedIndex = 1;
  };
  const field = el("label", "field"), lab = el("span", null, t("gl.companions"));
  const num = el("input", "input"); num.type = "number"; num.min = "1"; num.step = "1"; num.inputMode = "numeric"; num.value = "1";
  field.append(lab, num);
  const hint = el("p", "gl-hint", t("gl.left", { n: con }));
  search.oninput = fill; fill();
  const btn = el("button", "btn-primary", t("gl.submit")); btn.type = "submit";
  f.append(el("p", "gl-hint", t("gl.onlyVoted")), search, sel, field, hint, btn, el("p", "gl-hint", t("gl.noCancel")));
  open.onclick = () => { f.classList.remove("hidden"); open.classList.add("hidden"); open.setAttribute("aria-expanded", "true"); search.focus(); };
  f.onsubmit = async e => {
    e.preventDefault();
    if (!sel.value) return showMsg(s.ma, t("needPick"), false);
    const raw = String(num.value).trim();
    if (!/^\d{1,3}$/.test(raw)) return showMsg(s.ma, t("gl.badNum"), false);
    const diCung = Number(raw);  // số giao lưu = số người đi cùng
    if (diCung < 1) return showMsg(s.ma, t("gl.needCompanion"), false);
    if (diCung > con) return showMsg(s.ma, t("gl.over", { n: con }), false);
    btn.disabled = true; btn.textContent = t("sending");
    try { const res = await api("guest", { buoi: s.ma, ten: sel.value, diCung: String(diCung) }); afterAction(res, s.ma); }
    catch (err) { btn.disabled = false; btn.textContent = t("gl.submit"); showMsg(s.ma, err.message, false); }
  };
  wrap.append(open, f);
  return wrap;
}
function guestList(gl, soGL) {
  const list = el("div", "s-list"), ol = el("ol", "voters");
  list.append(el("h3", null, t("gl.list", { n: soGL })));
  gl.forEach((g, i) => {
    const li = voterRow(g, i), dc = Number(g.diCung) || 0;
    if (dc) li.append(el("span", "gl-plus", t("gl.plus", { n: dc })));
    ol.append(li);
  });
  list.append(ol);
  return list;
}

function afterAction(res, ma) {
  STATE = res; HISTORY = null; LOADED_AT = new Date();
  renderVote();
  showMsg(ma, res.thongBao ? tServer(res.thongBao) : t("done"), true);
}
function showMsg(ma, text, ok) {
  const card = [...document.querySelectorAll(".session")].find(c => c.dataset.ma === ma);
  const m = card && card.querySelector(".msg");
  if (!m) return;
  m.className = "msg " + (ok ? "ok" : "err"); m.textContent = text;
}

function confirmCancel(s, v) {
  const who = vi(el("p", "sheet-sub", v.ten));
  openSheet(t("cancelQ"), `${fmtThu(s)} · ${fmtNgay(s.ngay)}`, who, [
    [t("cancelYes"), "btn-primary btn-danger", async b => {
      b.disabled = true; b.textContent = t("cancelling");
      try { const res = await api("cancel", { id: v.id }); closeSheet(); afterAction(res, s.ma); }
      catch (err) { closeSheet(); showMsg(s.ma, err.message, false); }
    }],
    [t("no"), "btn-ghost", closeSheet]
  ]);
}

// ===== Tab Lịch sử =====
async function loadHistory() {
  const box = $("hist");
  if (HISTORY) return renderHistory();
  box.replaceChildren(el("div", "empty", t("histLoading")));
  try { const res = await api("history"); HISTORY = res.sessions; HIST_MEMBERS = res.members || STATE.members; renderHistory(); }
  catch (e) {
    box.replaceChildren(el("div", "card empty", e.message));
    const b = el("button", "btn-ghost", t("retry")); b.type = "button"; b.onclick = loadHistory; box.append(b);
  }
}
function renderHistory() {
  const box = $("hist");
  box.replaceChildren();
  if (!HISTORY.length) { box.append(el("div", "card empty", t("histEmpty"))); return; }
  HISTORY.forEach(s => {
    const b = el("button", "hist-item"); b.type = "button";
    const main = el("div", "h-main"), sub = el("span");
    sub.append(vi(el("span", null, s.gio)), document.createTextNode(" · "), vi(el("span", null, s.san)));
    main.append(el("b", null, `${fmtThu(s)} · ${fmtNgay(s.ngay)}`), sub);
    if (daDD(s)) main.append(el("span", "dd-badge", t("dd.done")));
    b.append(main, el("span", "h-count", t("people", { n: soNguoiLS(s) })));
    b.onclick = () => openHistory(s.ma);
    box.append(b);
  });
}
// Lịch sử: đã điểm danh → hiện danh sách điểm danh; chưa → danh sách đăng ký (vote + giao lưu)
const daDD = s => !!(s.diemDanh && s.diemDanh.da);
const soNguoiLS = s => (daDD(s) ? s.diemDanh.tong : tongCua(s));
const histBuoi = ma => (HISTORY || []).find(x => x.ma === ma);
function subLine(s, n) {
  const sub = el("p", "sheet-sub");
  sub.append(vi(el("span", null, s.gio)), document.createTextNode(" · "), vi(el("span", null, s.san)),
    document.createTextNode(" · " + t("people", { n })));
  return sub;
}
function ddRow(d, i) {  // "+n người đi cùng" nằm dưới tên, để chừa chỗ cho nút Sửa/Xoá
  const li = voterRow(d, i), dc = Number(d.diCung) || 0;
  if (dc) li.querySelector(".who").append(el("span", "gl-plus dd-plus", t("gl.plus", { n: dc })));
  return li;
}
function openHistory(ma) {
  const s = histBuoi(ma);
  if (!s) return closeSheet();
  const body = el("div");
  body.append(subLine(s, soNguoiLS(s)));
  if (daDD(s)) {
    body.append(el("h3", "dd-head", t("dd.done")));
    if (!s.diemDanh.ds.length) body.append(el("p", "empty", t("dd.empty")));
    else { const ol = el("ol", "voters"); s.diemDanh.ds.forEach((d, i) => ol.append(ddRow(d, i))); body.append(ol); }
  } else {
    const gl = s.giaoLuu || [];
    if (!s.votes.length && !gl.length) body.append(el("p", "empty", t("nobody")));
    if (s.votes.length) {
      const ol = el("ol", "voters");
      s.votes.forEach((v, i) => ol.append(voterRow(v, i)));
      body.append(ol);
    }
    if (gl.length) body.append(guestList(gl, Number(s.soGiaoLuu) || 0));
  }
  const actions = [[t("close"), "btn-ghost", closeSheet]];
  if (s.diemDanh) actions.unshift([t("dd.btn"), "btn-primary btn-att", () => openAttendance(ma)]);  // máy chủ cũ chưa có điểm danh → ẩn
  openSheet(`${fmtThu(s)} · ${fmtNgay(s.ngay)}`, "", body, actions);
}

// ===== Điểm danh (từ giờ bắt đầu chơi; ai có link cũng sửa được — người dùng chọn) =====
let HIST_MEMBERS = [];
function memberSelect(exclude, current) {
  const sel = el("select", "select"); sel.setAttribute("aria-label", t("pickLabel"));
  sel.append(new Option(t("pick"), ""));
  HIST_MEMBERS.filter(m => key(m.ten) === key(current) || !exclude.has(key(m.ten)))
    .forEach(m => { const o = new Option(m.boPhan ? `${m.ten} — ${m.boPhan}` : m.ten, m.ten); o.lang = "vi"; sel.append(o); });
  if (current) sel.value = [...sel.options].find(o => key(o.value) === key(current))?.value || "";
  return sel;
}
function numInput(v) {
  const n = el("input", "input dd-num"); n.type = "number"; n.min = "0"; n.step = "1"; n.inputMode = "numeric"; n.value = String(v || 0);
  n.setAttribute("aria-label", t("dd.companions"));
  return n;
}
async function attCall(ma, action, params, btn, msgEl) {
  if (btn) btn.disabled = true;
  try {
    const res = await api(action, params);
    HISTORY = res.sessions; HIST_MEMBERS = res.members || HIST_MEMBERS;
    renderHistory();
    openAttendance(ma, tServer(res.thongBao), true);
  } catch (err) {
    if (btn) btn.disabled = false;
    if (msgEl) { msgEl.className = "msg err"; msgEl.textContent = err.message; }
  }
}
function openAttendance(ma, note, ok) {
  const s = histBuoi(ma);
  if (!s) return closeSheet();
  const dd = s.diemDanh, body = el("div", "dd");
  const msg = el("p", "msg"); msg.setAttribute("role", "status"); msg.setAttribute("aria-live", "polite");
  if (note) { msg.className = "msg " + (ok ? "ok" : "err"); msg.textContent = note; }
  body.append(subLine(s, dd.tong), el("p", "dd-total", t("dd.total", { n: dd.tong })), msg);

  if (!dd.da) {
    body.append(el("p", "gl-hint", t("dd.fromRegHint")));
    const b = el("button", "btn-primary dd-fromreg", t("dd.fromReg")); b.type = "button";
    b.onclick = () => attCall(ma, "attStart", { buoi: ma }, b, msg);
    body.append(b);
  }

  const ol = el("ol", "voters dd-list");
  const coMat = new Set(dd.ds.map(d => key(d.ten)));
  dd.ds.forEach((d, i) => {
    const li = ddRow(d, i);
    const acts = el("div", "dd-acts");
    const eb = el("button", "btn-mini dd-edit-btn", t("dd.edit")); eb.type = "button";
    eb.setAttribute("aria-label", t("dd.edit") + " " + d.ten);
    const xb = el("button", "btn-mini btn-mini-bad", t("dd.del")); xb.type = "button";
    xb.setAttribute("aria-label", t("dd.del") + " " + d.ten);
    xb.onclick = () => { if (window.confirm(t("dd.delQ", { name: d.ten }))) attCall(ma, "attDel", { id: d.id }, xb, msg); };
    eb.onclick = () => {  // sửa tại chỗ: đổi người + số người đi cùng
      const f = el("form", "dd-edit"); f.noValidate = true;
      const sel = memberSelect(coMat, d.ten), num = numInput(d.diCung);
      const lab = el("label", "field"); lab.append(el("span", null, t("dd.companions")), num);
      const save = el("button", "btn-primary", t("dd.save")); save.type = "submit";
      const back = el("button", "btn-ghost", t("dd.cancelEdit")); back.type = "button";
      back.onclick = () => openAttendance(ma);
      f.append(sel, lab, save, back);
      f.onsubmit = e => { e.preventDefault(); attCall(ma, "attEdit", { id: d.id, ten: sel.value || d.ten, diCung: num.value }, save, msg); };
      li.replaceChildren(f);
      sel.focus();
    };
    acts.append(eb, xb);
    li.append(acts);
    ol.append(li);
  });
  if (dd.da && !dd.ds.length) body.append(el("p", "empty", t("dd.empty")));
  body.append(ol);

  // Thêm người có mặt: chỉ thành viên đã duyệt, kèm số người đi cùng
  const add = el("form", "s-form dd-add"); add.noValidate = true;
  const sel = memberSelect(coMat, ""), num = numInput(0);
  const lab = el("label", "field"); lab.append(el("span", null, t("dd.companions")), num);
  const ab = el("button", "btn-primary", t("dd.addBtn")); ab.type = "submit";
  add.append(el("h3", "dd-head", t("dd.add")), sel, lab, ab);
  add.onsubmit = e => {
    e.preventDefault();
    if (!sel.value) { msg.className = "msg err"; msg.textContent = t("needPick"); return; }
    attCall(ma, "attAdd", { buoi: ma, ten: sel.value, diCung: num.value }, ab, msg);
  };
  body.append(add);

  openSheet(`${t("dd.title")} · ${fmtThu(s)} · ${fmtNgay(s.ngay)}`, "", body,
    [[t("dd.back"), "btn-ghost", () => openHistory(ma)], [t("close"), "btn-ghost", closeSheet]]);
}

// ===== Tab Đăng ký =====
async function submitRegister(e) {
  e.preventDefault();
  const msg = $("reg-msg"), btn = $("reg-btn");
  const ten = $("reg-ten").value.trim(), boPhan = $("reg-bophan").value.trim(), sdt = $("reg-sdt").value.trim();
  const fail = tx => { msg.className = "msg err"; msg.textContent = tx; };
  if (!ten) return fail(t("reg.needName"));
  if (!boPhan) return fail(t("reg.needDept"));
  btn.disabled = true; btn.textContent = t("sending"); msg.textContent = "";
  try {
    const res = await api("register", { ten, boPhan, sdt });
    $("reg-form").reset();
    msg.className = "msg ok"; msg.textContent = tServer(res.thongBao);
  } catch (err) { fail(err.message); }
  btn.disabled = false; btn.textContent = t("reg.submit");
}

// ===== Hộp thoại =====
function openSheet(title, sub, body, actions) {
  $("sheet-title").textContent = title;
  const b = $("sheet-body"); b.replaceChildren();
  if (sub) b.append(el("p", "sheet-sub", sub));
  if (body) b.append(body);
  const a = $("sheet-actions"); a.replaceChildren();
  actions.forEach(([text, cls, fn]) => { const btn = el("button", cls, text); btn.type = "button"; btn.onclick = () => fn(btn); a.append(btn); });
  $("sheet-bg").classList.add("open");
}
function closeSheet() { $("sheet-bg").classList.remove("open"); }

// ===== Chuyển tab =====
let current = "vote";
function show(v) {
  current = v;
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("active", s.id === "v-" + v));
  document.querySelectorAll(".tab").forEach(tb => { if (tb.dataset.view === v) tb.setAttribute("aria-current", "page"); else tb.removeAttribute("aria-current"); });
  if (v === "history") loadHistory();
  window.scrollTo(0, 0);
}

// ===== Ngôn ngữ (lưu lựa chọn trên máy người xem; không lưu được thì vẫn chạy bình thường) =====
function setLang(l, save = true) {
  LANG = l === "zh" ? "zh" : "vi";
  if (save) { try { localStorage.setItem("lang", LANG); } catch (e) {} $("lang-gate").classList.add("hidden"); }
  document.documentElement.lang = LANG === "zh" ? "zh-Hans" : "vi";
  document.querySelectorAll("[data-i18n]").forEach(n => n.textContent = t(n.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(n => n.setAttribute("aria-label", t(n.dataset.i18nAria)));
  document.querySelectorAll(".lang-btn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  $("build-info").textContent = CFG.builtAt ? t("build", { t: fmtNow(new Date(CFG.builtAt)) }) : "";
  if (!$("loading-screen").classList.contains("error")) $("load-msg").textContent = t("load");
  $("reg-msg").textContent = "";
  renderVote();
  if (HISTORY) renderHistory();
  closeSheet();
}
function savedLang() {
  try { return localStorage.getItem("lang"); } catch (e) { return null; }
}
// Hiện màn hình chọn ngôn ngữ (lần đầu vào web, hoặc khi không lưu được lựa chọn)
function showLangGate() {
  $("lang-gate").classList.remove("hidden");
  const first = document.querySelector('.lang-pick[data-lang="' + LANG + '"]');
  if (first) first.focus();
}

// ===== Khởi động =====
const siteName = (CFG.site && CFG.site.name) || "Cầu Lông";
document.title = siteName;
document.querySelectorAll(".site-name").forEach(n => n.textContent = siteName);
document.querySelectorAll(".tab").forEach(tb => tb.onclick = () => show(tb.dataset.view));
document.querySelectorAll(".lang-btn, .lang-pick").forEach(b => b.onclick = () => setLang(b.dataset.lang));
$("reload").onclick = loadState;
$("load-retry").onclick = loadState;
$("reg-form").onsubmit = submitRegister;
$("sheet-bg").onclick = e => { if (e.target.id === "sheet-bg") closeSheet(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
const saved = savedLang();
if (saved) setLang(saved);
else { setLang(/^zh/i.test(navigator.language || "") ? "zh" : "vi", false); showLangGate(); }  // web tải ngầm phía sau trong lúc chọn
show("vote");
loadState();

</script>
</body>
</html>
